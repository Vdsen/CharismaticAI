<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Charisma Ultra | Pro Social AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
        }

        .ad-container-top {
            width: 100%;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .ad-container-bottom {
            width: 100%;
            min-height: 250px; /* Essential for native ads to show up */
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            margin-top: 20px;
            padding: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.5);
        }

        .result-item {
            animation: slideUp 0.4s ease-out forwards;
            opacity: 0;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        iframe { max-width: 100% !important; border-radius: 8px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-50 px-4 py-4 glass rounded-none border-t-0 border-x-0 border-b border-white/5 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="p-2 bg-indigo-600 rounded-lg">
                <i class="fas fa-bolt text-white text-xs"></i>
            </div>
            <h1 class="font-extrabold text-sm tracking-tighter uppercase">Charisma<span class="text-indigo-400">Ultra</span></h1>
        </div>
        <div class="px-2 py-1 bg-indigo-500/10 rounded-full">
            <span class="text-[10px] font-bold text-indigo-400 uppercase">Live</span>
        </div>
    </header>

    <main class="flex-1 px-4 py-6 max-w-xl mx-auto w-full space-y-6 pb-48">
        
        <!-- TOP AD -->
        <div class="ad-container-top">
            <script type="text/javascript">
                atOptions = {
                    'key' : '31df67946ac4c09002d09c7a9fb3911f',
                    'format' : 'iframe',
                    'height' : 60,
                    'width' : 468,
                    'params' : {}
                };
            </script>
            <script type="text/javascript" src="//www.highperformanceformat.com/31df67946ac4c09002d09c7a9fb3911f/invoke.js"></script>
        </div>

        <!-- Upload -->
        <div id="dropZone" class="glass p-8 border-2 border-dashed border-white/10 text-center cursor-pointer">
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            <div id="uploadPrompt">
                <i class="fas fa-image text-3xl text-indigo-400 mb-3"></i>
                <h2 class="text-sm font-bold">Select Screenshot</h2>
            </div>
            <div id="imagePreview" class="hidden relative">
                <img id="imgDisplay" class="rounded-xl max-h-64 mx-auto border border-white/10">
                <button id="clearImg" class="absolute -top-3 -right-3 w-8 h-8 bg-rose-500 rounded-full flex items-center justify-center">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Instructions -->
        <div class="glass p-5 space-y-3">
            <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Context Hint</span>
            <textarea id="instructions" 
                class="w-full bg-slate-950/50 rounded-xl p-4 text-sm border border-white/5 outline-none min-h-[80px]" 
                placeholder="Ex: 'Sound cooler' or 'Just being friendly'"></textarea>
        </div>

        <!-- Results Wrapper -->
        <div id="resultsWrapper" class="hidden space-y-4">
            <div class="glass p-4 border-l-4 border-l-indigo-500 bg-indigo-500/5">
                <p id="contextText" class="text-xs text-slate-300 italic"></p>
            </div>

            <div id="cardsContainer" class="grid gap-3"></div>

            <!-- BOTTOM NATIVE AD -->
            <div class="ad-container-bottom">
                <p class="text-[9px] text-slate-600 text-center mb-2 uppercase tracking-widest">Recommended Social Content</p>
                <!-- Native Ad Integration -->
                <script async="async" data-cfasync="false" src="https://pl28671138.effectivegatecpm.com/1895cd54b9819032822afba251676511/invoke.js"></script>
                <div id="container-1895cd54b9819032822afba251676511"></div>
            </div>
        </div>

        <div id="onboarding" class="text-center py-6">
            <p class="text-[10px] text-slate-600 uppercase tracking-[0.5em]">Neural Link Ready</p>
        </div>
    </main>

    <!-- Fixed Bottom Action Bar -->
    <div class="fixed bottom-0 left-0 right-0 p-5 glass rounded-none border-t border-white/10 z-[100]">
        <div id="errorMsg" class="hidden text-center text-xs text-rose-400 font-bold mb-3"></div>
        <button id="analyzeBtn" disabled class="btn-primary w-full py-4 rounded-2xl text-xs font-black uppercase tracking-widest disabled:opacity-30 flex items-center justify-center gap-3">
            <span id="btnText">Execute Analysis</span>
            <i id="btnIcon" class="fas fa-bolt"></i>
        </button>
    </div>

    <script type="module">
        const apiKey = "AIzaSyDUg7aKLYQd-DPS1DTfZzt1eQ1bs83rm3o";
        let base64Image = null;

        const ui = {
            fileInput: document.getElementById('fileInput'),
            analyzeBtn: document.getElementById('analyzeBtn'),
            imgDisplay: document.getElementById('imgDisplay'),
            imagePreview: document.getElementById('imagePreview'),
            uploadPrompt: document.getElementById('uploadPrompt'),
            clearImg: document.getElementById('clearImg'),
            dropZone: document.getElementById('dropZone'),
            instructions: document.getElementById('instructions'),
            resultsWrapper: document.getElementById('resultsWrapper'),
            contextText: document.getElementById('contextText'),
            cardsContainer: document.getElementById('cardsContainer'),
            onboarding: document.getElementById('onboarding'),
            btnText: document.getElementById('btnText'),
            btnIcon: document.getElementById('btnIcon'),
            errorMsg: document.getElementById('errorMsg')
        };

        ui.dropZone.onclick = () => ui.fileInput.click();
        ui.clearImg.onclick = (e) => {
            e.stopPropagation();
            base64Image = null;
            ui.imagePreview.classList.add('hidden');
            ui.uploadPrompt.classList.remove('hidden');
            ui.analyzeBtn.disabled = true;
        };

        ui.fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                base64Image = ev.target.result.split(',')[1];
                ui.imgDisplay.src = ev.target.result;
                ui.imagePreview.classList.remove('hidden');
                ui.uploadPrompt.classList.add('hidden');
                ui.analyzeBtn.disabled = false;
                ui.onboarding.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        };

        window.copyReply = (btn, text) => {
            const temp = document.createElement("textarea");
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            document.body.removeChild(temp);
            btn.innerText = "COPIED!";
            setTimeout(() => btn.innerText = "COPY REPLY", 1500);
        };

        ui.analyzeBtn.onclick = async () => {
            if (!base64Image) return;
            ui.analyzeBtn.disabled = true;
            ui.btnText.innerText = "Processing...";
            
            const hint = ui.instructions.value.trim();
            const prompt = `Coach: Analyze chat. Hint: "${hint}". 3 replies (Pro, Sweet, Witty) in JSON: { "context": "...", "replies": [{"title": "...", "text": "...", "icon": "..."}] }`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/png", data: base64Image } }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                const res = JSON.parse(data.candidates[0].content.parts[0].text);

                ui.contextText.innerText = res.context;
                ui.cardsContainer.innerHTML = res.replies.map((r, i) => `
                    <div class="result-item glass p-5 border border-white/5" style="animation-delay: ${i * 0.1}s">
                        <span class="text-[9px] font-bold text-indigo-400 uppercase tracking-widest">${r.title}</span>
                        <p class="text-sm font-semibold text-slate-200 my-2 leading-relaxed">${r.text}</p>
                        <button onclick="copyReply(this, \`${r.text.replace(/`/g, "\\`")}\`)" class="w-full py-2 bg-indigo-500/10 rounded-xl text-[10px] font-bold text-indigo-400 uppercase">Copy Reply</button>
                    </div>
                `).join('');

                ui.resultsWrapper.classList.remove('hidden');
                ui.resultsWrapper.scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                ui.errorMsg.innerText = "Error: Check screenshot clarity.";
                ui.errorMsg.classList.remove('hidden');
            } finally {
                ui.btnText.innerText = "Execute Analysis";
                ui.analyzeBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
