<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Charisma Ultra | Smart Social AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --primary: #6366f1;
            --surface: #0f172a;
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ad-container {
            width: 100%;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin: 10px 0;
            overflow: hidden;
        }

        .transition-fast {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .result-card {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-panel px-4 py-3 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                <i class="fas fa-wand-magic-sparkles text-white text-sm"></i>
            </div>
            <h1 class="font-extrabold tracking-tight text-sm uppercase italic">Charisma<span class="text-indigo-400">Ultra</span></h1>
        </div>
        <div id="statusIndicator" class="flex items-center gap-1.5 px-2 py-1 bg-emerald-500/10 rounded-full">
            <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
            <span class="text-[9px] font-bold text-emerald-500 uppercase">Active</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col p-4 gap-4 max-w-2xl mx-auto w-full pb-32">
        
        <!-- Top Ad Placement -->
        <div class="ad-container">
            <!-- Adsterra Top Script Start -->
            <script async="async" data-cfasync="false" src="https://pl28671138.effectivegatecpm.com/1895cd54b9819032822afba251676511/invoke.js"></script>
            <div id="container-1895cd54b9819032822afba251676511"></div>
            <!-- Adsterra Top Script End -->
        </div>

        <!-- Upload Zone -->
        <div id="dropZone" class="relative overflow-hidden rounded-2xl glass-panel min-h-[160px] flex flex-col items-center justify-center border-2 border-dashed border-white/10 group transition-fast">
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            
            <div id="uploadPrompt" class="text-center p-6">
                <i class="fas fa-camera text-3xl text-slate-500 mb-2"></i>
                <p class="text-sm font-semibold text-slate-300">Screenshot Upload Karein</p>
                <p class="text-[10px] text-slate-500">Fast AI Analysis</p>
            </div>

            <div id="imagePreview" class="hidden w-full h-full p-2 relative">
                <img id="imgDisplay" class="w-full max-h-[250px] object-contain rounded-xl shadow-2xl">
                <button id="clearImg" class="absolute top-4 right-4 w-8 h-8 bg-black/60 backdrop-blur-md rounded-full border border-white/20 flex items-center justify-center">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Directives Input -->
        <div class="glass-panel rounded-2xl p-4">
            <div class="flex items-center gap-2 mb-3">
                <i class="fas fa-brain text-indigo-400 text-xs"></i>
                <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Special Instructions</span>
            </div>
            <textarea id="instructions" 
                class="w-full bg-white/5 rounded-xl p-3 text-sm border border-white/5 focus:border-indigo-500/50 outline-none transition-all placeholder:text-slate-600 min-h-[80px]" 
                placeholder="Ex: 'Sound more romantic' ya 'Apology deni hai'"></textarea>
        </div>

        <!-- Results Wrapper -->
        <div id="resultsWrapper" class="hidden space-y-4">
            <div id="contextCard" class="glass-panel rounded-2xl p-4 border-l-4 border-l-indigo-500">
                <p id="contextText" class="text-xs leading-relaxed text-slate-300"></p>
            </div>

            <div class="grid gap-3" id="cardsContainer">
                <!-- AI Generated Cards -->
            </div>

            <!-- Bottom Ad Placement (Inside Results) -->
            <div class="ad-container">
                <p class="text-[8px] text-slate-600 uppercase mb-1">Sponsored</p>
                <!-- Adsterra Bottom/Native code could go here -->
                <div style="width:100%; height:auto;" id="ad-placeholder-bottom"></div>
            </div>
        </div>

        <div id="onboarding" class="text-center py-10 opacity-30">
            <i class="fas fa-message text-4xl mb-4"></i>
            <p class="text-xs uppercase tracking-[0.3em]">Ready For Analysis</p>
        </div>
    </main>

    <!-- Bottom Action Bar -->
    <div class="fixed bottom-0 left-0 right-0 p-4 glass-panel border-t border-white/10 z-50">
        <div id="errorMsg" class="hidden text-[10px] text-rose-400 font-bold text-center mb-3 bg-rose-400/10 py-2 rounded-lg"></div>
        <button id="analyzeBtn" disabled class="w-full bg-indigo-600 disabled:bg-slate-800 disabled:text-slate-500 text-white font-extrabold py-4 rounded-2xl shadow-xl active:scale-95 transition-fast flex items-center justify-center gap-3">
            <span id="btnText">ANALYZE CHAT</span>
            <i class="fas fa-bolt text-sm" id="btnIcon"></i>
        </button>
    </div>

    <script type="module">
        const apiKey = "AIzaSyDUg7aKLYQd-DPS1DTfZzt1eQ1bs83rm3o";
        let base64Image = null;

        const ui = {
            fileInput: document.getElementById('fileInput'),
            analyzeBtn: document.getElementById('analyzeBtn'),
            imgDisplay: document.getElementById('imgDisplay'),
            imagePreview: document.getElementById('imagePreview'),
            uploadPrompt: document.getElementById('uploadPrompt'),
            clearImg: document.getElementById('clearImg'),
            dropZone: document.getElementById('dropZone'),
            instructions: document.getElementById('instructions'),
            resultsWrapper: document.getElementById('resultsWrapper'),
            contextText: document.getElementById('contextText'),
            cardsContainer: document.getElementById('cardsContainer'),
            onboarding: document.getElementById('onboarding'),
            btnText: document.getElementById('btnText'),
            btnIcon: document.getElementById('btnIcon'),
            errorMsg: document.getElementById('errorMsg')
        };

        ui.dropZone.onclick = () => ui.fileInput.click();
        ui.clearImg.onclick = (e) => {
            e.stopPropagation();
            base64Image = null;
            ui.imagePreview.classList.add('hidden');
            ui.uploadPrompt.classList.remove('hidden');
            ui.analyzeBtn.disabled = true;
        };

        ui.fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                base64Image = ev.target.result.split(',')[1];
                ui.imgDisplay.src = ev.target.result;
                ui.imagePreview.classList.remove('hidden');
                ui.uploadPrompt.classList.add('hidden');
                ui.analyzeBtn.disabled = false;
                ui.onboarding.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        };

        window.copyReply = (btn, text) => {
            const temp = document.createElement("textarea");
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            document.body.removeChild(temp);
            btn.innerHTML = `<i class="fas fa-check"></i> Copied!`;
            setTimeout(() => btn.innerHTML = `<i class="fas fa-copy"></i> Copy`, 1500);
        };

        ui.analyzeBtn.onclick = async () => {
            if (!base64Image) return;
            ui.analyzeBtn.disabled = true;
            ui.btnText.innerText = "Analyzing...";
            ui.btnIcon.className = "fas fa-sync animate-spin";
            
            const hint = ui.instructions.value.trim();
            const prompt = `Act as a Social Charisma Coach. Analyze this chat. User Hint: "${hint}". Provide 3 replies (Sophisticated, Empathetic, Flirty) in JSON: { "context": "...", "replies": [{"title": "...", "text": "...", "icon": "..."}] }`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/png", data: base64Image } }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                const res = JSON.parse(data.candidates[0].content.parts[0].text);

                ui.contextText.innerText = res.context;
                ui.cardsContainer.innerHTML = res.replies.map(r => `
                    <div class="result-card glass-panel p-4 rounded-2xl border border-white/5">
                        <span class="text-[9px] font-bold text-indigo-400 uppercase tracking-widest">${r.title}</span>
                        <p class="text-sm font-semibold text-slate-200 my-2">${r.text}</p>
                        <button onclick="copyReply(this, \`${r.text.replace(/`/g, "\\`")}\`)" class="w-full py-2 bg-white/5 rounded-lg text-[10px] font-bold uppercase tracking-widest flex items-center justify-center gap-2">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </div>
                `).join('');

                ui.resultsWrapper.classList.remove('hidden');
                ui.resultsWrapper.scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                ui.errorMsg.innerText = "Error: Image clear nahi hai ya connection fail ho gaya.";
                ui.errorMsg.classList.remove('hidden');
            } finally {
                ui.btnText.innerText = "ANALYZE CHAT";
                ui.btnIcon.className = "fas fa-bolt";
                ui.analyzeBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
